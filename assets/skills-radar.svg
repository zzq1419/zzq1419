<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 460 460" width="440" height="440" role="img" aria-label="技能自评雷达图">
  <defs>
    <linearGradient id="radarFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c6ef5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7950f2" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="-20" y="-20" width="500" height="500" fill="#ffffff"/>

  <!-- grid rings -->
  <g fill="none" stroke="#e3e8ef" stroke-width="1.2">
    <polygon points="210,172.5 242.5,191.25 242.5,228.75 210,247.5 177.5,228.75 177.5,191.25"/>
    <polygon points="210,135 275,172.5 275,247.5 210,285 145,247.5 145,172.5"/>
    <polygon points="210,97.5 307.4,153.75 307.4,266.25 210,322.5 112.6,266.25 112.6,153.75"/>
    <polygon points="210,60 339.9,135 339.9,285 210,360 80.1,285 80.1,135"/>
  </g>

  <!-- axes -->
  <g stroke="#e3e8ef" stroke-width="1.2">
    <line x1="210" y1="210" x2="210" y2="60"/>
    <line x1="210" y1="210" x2="339.9" y2="135"/>
    <line x1="210" y1="210" x2="339.9" y2="285"/>
    <line x1="210" y1="210" x2="210" y2="360"/>
    <line x1="210" y1="210" x2="80.1" y2="285"/>
    <line x1="210" y1="210" x2="80.1" y2="135"/>
  </g>

  <!-- data polygon -->
  <polygon points="210,90 320.4,146.25 307.4,266.25 210,315 151.5,243.75 158,180"
           fill="url(#radarFill)" stroke="#4c6ef5" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- data points -->
  <g fill="#ffffff" stroke="#4c6ef5" stroke-width="2.5">
    <circle cx="210" cy="90" r="4.5"/>
    <circle cx="320.4" cy="146.25" r="4.5"/>
    <circle cx="307.4" cy="266.25" r="4.5"/>
    <circle cx="210" cy="315" r="4.5"/>
    <circle cx="151.5" cy="243.75" r="4.5"/>
    <circle cx="158" cy="180" r="4.5"/>
  </g>

  <!-- labels -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#3d4759">
    <text x="210" y="44" text-anchor="middle">数据处理 80</text>
    <text x="348" y="128">前端工程 85</text>
    <text x="348" y="300">数据库 75</text>
    <text x="210" y="386" text-anchor="middle">算法基础 70</text>
    <text x="72" y="300" text-anchor="end">ML / AI 45</text>
    <text x="72" y="128" text-anchor="end">后端工程 40</text>
  </g>

  <text x="210" y="424" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8b93a7">自评满分 100 · 数据科学与大数据技术方向</text>
</svg>
