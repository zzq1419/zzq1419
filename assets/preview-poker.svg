<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="德州扑克模拟器预览">
  <defs>
    <radialGradient id="felt" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1f7a52"/>
      <stop offset="100%" stop-color="#0b3623"/>
    </radialGradient>
    <linearGradient id="potBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2fbf71"/>
      <stop offset="100%" stop-color="#f59f00"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#felt)"/>
  <ellipse cx="600" cy="300" rx="520" ry="240" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <text x="600" y="58" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#ffffff">Texas Hold'em Simulator</text>
  <text x="600" y="86" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#9fd8bd">单文件纯前端 · 完整牌型判定 · 实时胜率</text>

  <!-- pot -->
  <g transform="translate(600,140)">
    <rect x="-110" y="-30" width="220" height="60" rx="30" fill="#000000" opacity="0.28"/>
    <text x="0" y="8" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ffd43b">POT 1,240</text>
  </g>

  <!-- community cards -->
  <g filter="url(#cardShadow)">
    <g transform="translate(288,190)">
      <rect width="112" height="156" rx="10" fill="#ffffff"/>
      <text x="56" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#1a1d24">A</text>
      <text x="56" y="110" text-anchor="middle" font-size="42" fill="#1a1d24">♠</text>
    </g>
    <g transform="translate(416,190)">
      <rect width="112" height="156" rx="10" fill="#ffffff"/>
      <text x="56" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#d92b2b">K</text>
      <text x="56" y="110" text-anchor="middle" font-size="42" fill="#d92b2b">♥</text>
    </g>
    <g transform="translate(544,190)">
      <rect width="112" height="156" rx="10" fill="#ffffff"/>
      <text x="56" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#1a1d24">Q</text>
      <text x="56" y="110" text-anchor="middle" font-size="42" fill="#1a1d24">♠</text>
    </g>
    <g transform="translate(672,190)">
      <rect width="112" height="156" rx="10" fill="#ffffff"/>
      <text x="56" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#1a1d24">J</text>
      <text x="56" y="110" text-anchor="middle" font-size="42" fill="#1a1d24">♠</text>
    </g>
    <g transform="translate(800,190)">
      <rect width="112" height="156" rx="10" fill="#ffffff"/>
      <text x="56" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#1a1d24">10</text>
      <text x="56" y="110" text-anchor="middle" font-size="42" fill="#1a1d24">♠</text>
    </g>
  </g>

  <text x="600" y="372" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#ffd43b">皇家同花顺 ROYAL FLUSH</text>

  <!-- hole cards -->
  <g filter="url(#cardShadow)">
    <g transform="translate(498,400)">
      <rect width="116" height="162" rx="10" fill="#ffffff"/>
      <text x="58" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#1a1d24">A</text>
      <text x="58" y="114" text-anchor="middle" font-size="44" fill="#1a1d24">♠</text>
    </g>
    <g transform="translate(628,400)">
      <rect width="116" height="162" rx="10" fill="#ffffff"/>
      <text x="58" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#d92b2b">K</text>
      <text x="58" y="114" text-anchor="middle" font-size="44" fill="#d92b2b">♦</text>
    </g>
  </g>
  <text x="596" y="586" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#9fd8bd">你的手牌</text>

  <!-- win rate panel -->
  <g transform="translate(60,430)">
    <rect width="300" height="118" rx="16" fill="#000000" opacity="0.3"/>
    <text x="24" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#9fd8bd">实时胜率</text>
    <text x="276" y="38" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#2fbf71">72.4%</text>
    <rect x="24" y="52" width="252" height="10" rx="5" fill="#ffffff" opacity="0.16"/>
    <rect x="24" y="52" width="182" height="10" rx="5" fill="url(#potBar)"/>
    <text x="24" y="86" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#9fd8bd">底池赔率 3.5 : 1</text>
    <text x="24" y="106" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#7fc4a3">建议：加注</text>
  </g>

  <!-- chips -->
  <g transform="translate(880,430)">
    <g>
      <ellipse cx="60" cy="96" rx="34" ry="12" fill="#d92b2b"/><ellipse cx="60" cy="92" rx="34" ry="12" fill="#ef4444"/>
      <ellipse cx="60" cy="86" rx="34" ry="12" fill="#d92b2b"/><ellipse cx="60" cy="82" rx="34" ry="12" fill="#ef4444"/>
      <ellipse cx="140" cy="96" rx="34" ry="12" fill="#1f6fd0"/><ellipse cx="140" cy="92" rx="34" ry="12" fill="#3b82f6"/>
      <ellipse cx="140" cy="86" rx="34" ry="12" fill="#1f6fd0"/><ellipse cx="140" cy="82" rx="34" ry="12" fill="#3b82f6"/>
      <ellipse cx="220" cy="96" rx="34" ry="12" fill="#2fbf71"/><ellipse cx="220" cy="92" rx="34" ry="12" fill="#4ade80"/>
    </g>
    <text x="140" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#9fd8bd">筹码 3,860</text>
  </g>
</svg>
